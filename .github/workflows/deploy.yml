name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to REG.RU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod
      url: http://hostingproject.ru/

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_PRIVATE_KEY" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -T 15 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload frontend assets
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p -- '$DEPLOY_PATH/public/build' '$DEPLOY_PATH/build'"
          scp -r -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            public/build/. \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/public/build/"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cp -a -- '$DEPLOY_PATH/public/build/.' '$DEPLOY_PATH/build/'"

      - name: Deploy application
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$DEPLOY_SHA'" <<'DEPLOY_SCRIPT'
          set -Eeuo pipefail

          deploy_path="$1"
          deploy_sha="$2"
          php_binary='/opt/php/8.5/bin/php'

          cd "$deploy_path"
          test -x "$php_binary"

          test "$(git branch --show-current)" = 'master'
          if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push --message "pre-deploy-$deploy_sha"
          fi
          git remote set-url origin https://github.com/katyapichkurova777-sys/hosting_project.git
          git fetch origin master
          git merge-base --is-ancestor "$deploy_sha" origin/master
          git merge --ff-only "$deploy_sha"
          test "$(git rev-parse HEAD)" = "$deploy_sha"
          test -f "$HOME/bin/composer"
          "$php_binary" "$HOME/bin/composer" install \
              --no-dev \
              --no-interaction \
              --no-progress \
              --prefer-dist \
              --optimize-autoloader
          "$php_binary" artisan migrate --force
          "$php_binary" artisan optimize
          DEPLOY_SCRIPT
